[project]
name = "pairslab"
version = "0.1.0"
description = "Pairs-trading research platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.1",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "statsmodels>=0.15.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
app = [
    "plotly>=7.2.0",
    "streamlit>=1.67.0",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "cpp"
cmake.build-type = "Release"
wheel.packages = ["src/pairslab"]
build-dir = "build/{wheel_tag}"

[tool.uv]
# `uv sync` also installs the dashboard dependencies, so CI can test the app.
default-groups = ["dev", "app"]
# Rebuild the C++ extension whenever its sources change (uv otherwise caches the build).
cache-keys = [{ file = "pyproject.toml" }, { file = "cpp/**" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
